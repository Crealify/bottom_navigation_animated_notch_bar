name: bottom_navigation_animated_notch_bar
description: "A uniquely designed, highly customizable animated notch bottom navigation bar for Flutter with smooth transitions and glassmorphism support."
version: 1.0.3
homepage: "https://github.com/crealify/bottom_navigation_animated_notch_bar"
repository: "https://github.com/crealify/bottom_navigation_animated_notch_bar"
issue_tracker: "https://github.com/crealify/bottom_navigation_animated_notch_bar/issues"

topics:
  - navigation
  - bottom-bar
  - animation
  - ui-component
  - notch

environment:
  sdk: ^3.2.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.2.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

